name: Bug Report
description: Report a bug or unexpected behavior on the site
title: "[Bug]: "
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: Thanks for taking the time to fill out this bug report!
    - type: textarea
      id: description
      attributes:
          label: Description
          description: What happened? What did you expect to happen instead?
          placeholder: A clear and concise description of the bug
      validations:
          required: true
    - type: input
      id: url
      attributes:
          label: Affected page / URL
          description: Which page or article is affected?
          placeholder: e.g. https://example.com/writeups/...
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          description: How can we reproduce the issue?
          placeholder: |
              1. Go to ...
              2. Click on ...
              3. Scroll down to ...
              4. See error
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
          description: What did you expect to happen?
      validations:
          required: true
    - type: textarea
      id: actual
      attributes:
          label: Actual behavior
          description: What actually happened instead?
      validations:
          required: true
    - type: textarea
      id: screenshots
      attributes:
          label: Screenshots
          description: If applicable, add screenshots to help explain the problem.
          placeholder: Drag and drop or paste images here
    - type: dropdown
      id: browser
      attributes:
          label: Browser
          description: Which browser are you using?
          options:
              - Chrome
              - Firefox
              - Safari
              - Edge
              - Other
    - type: input
      id: os
      attributes:
          label: Operating System
          description: Which OS are you using?
          placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
    - type: textarea
      id: content
      attributes:
          label: Related content
          description: If the bug involves an article or content, mention the title or file path under contents/.
          placeholder: e.g. contents/writeups/2026/02/01_...mdx
