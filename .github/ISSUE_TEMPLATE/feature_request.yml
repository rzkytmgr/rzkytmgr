name: Feature Request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement"]
body:
    - type: markdown
      attributes:
          value: Thanks for taking the time to share your idea!
    - type: textarea
      id: motivation
      attributes:
          label: Motivation
          description: What problem are you trying to solve? What is the use case?
          placeholder: Describe the problem or gap you see
      validations:
          required: true
    - type: textarea
      id: solution
      attributes:
          label: Proposed solution
          description: What would you like to see implemented?
          placeholder: Describe your idea in as much detail as possible
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: What workarounds or alternatives have you considered?
          placeholder: Describe any alternative approaches
